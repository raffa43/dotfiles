# ====================================================================
# MPV & UOSC Input Configuration
" script-binding console/enable
` script-binding console/enable
˜ script-binding console/enable
alt+c script-binding console/enable

# Timeline & Playback Controls
space        cycle pause; script-binding uosc/flash-pause-indicator
mbtn_right   cycle pause; script-binding uosc/flash-pause-indicator

right        seek  5; script-binding uosc/flash-timeline
left         seek -5; script-binding uosc/flash-timeline
shift+right  seek 30; script-binding uosc/flash-timeline
shift+left   seek -30; script-binding uosc/flash-timeline
ctrl+right   seek 60; script-binding uosc/flash-timeline
ctrl+left    seek -60; script-binding uosc/flash-timeline

# Volume Controls
up           add volume  2; script-binding uosc/flash-volume
down         add volume -2; script-binding uosc/flash-volume
m            cycle mute; script-binding uosc/flash-volume
AXIS_UP      add volume  2; script-binding uosc/flash-volume
AXIS_DOWN    add volume -2; script-binding uosc/flash-volume

# Speed Controls
[            multiply speed 1/1.1; script-binding uosc/flash-speed
]            multiply speed 1.1; script-binding uosc/flash-speed
\            set speed 1.0; script-binding uosc/flash-speed

# UOSC Interface & Menus
tab          script-binding uosc/toggle-ui
menu         script-binding uosc/menu
ctrl+p       script-binding uosc/menu
s            script-binding uosc/subtitles
a            script-binding uosc/audio
v            script-binding uosc/video
p            script-binding uosc/items
# c            script-binding uosc/chapters
# q            script-binding uosc/stream-quality
o            script-binding uosc/open-file

# Navigation
h            script-binding memo-history
ctrl+f       script-binding memo-search
>            script-binding uosc/next
<            script-binding uosc/prev
alt+>        script-binding uosc/delete-file-next
alt+<        script-binding uosc/delete-file-prev
alt+esc      script-binding uosc/show-in-directory

# Window & General Controls
f            cycle fullscreen
ESC          set fullscreen no
ctrl+q       quit-watch-later
Q            quit-watch-later
q            quit-watch-later


g            script-message contact-sheet-close; script-message playlist-view-toggle
c            script-message playlist-view-close; script-message contact-sheet-toggle
ctrl+alt+u   script-message Quick_Scale 2880 1800 1 2
D            script-message-to description_menu show

