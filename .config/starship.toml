# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 2000

# Two-line prompt: Context on top, input on bottom
format = """
[ 祺 ](bold cyan)$os$directory$git_branch$git_status$c$python$dart$swift$docker_context$azure$cmd_duration
$character"""

[character]
success_symbol = '[ ┗━ λ ❯](bold green)'
error_symbol = '[ ┗━ λ ❯](bold red)'

[os]
disabled = false
format = '[$symbol]($style) '

[os.symbols]
CachyOS = " "
Arch = " "
Macos = " "

[directory]
style = "bold blue"
read_only = " "
truncation_length = 3
truncate_to_repo = true
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = " "
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '

[battery]
full_symbol = '🔋 '
charging_symbol = '⚡️ '
discharging_symbol = '💀 '
display = [
  { threshold = 20, style = "bold red" },
]

[package]
disabled = true

[azure]
disabled = false
format = 'on [$symbol($subscription)]($style) '
symbol = '󰠅 '
style = 'blue bold'

# Language & Toolchain Modules
[c]
symbol = "C "
detect_extensions = ['c', 'cpp', 'h', 'hpp']
detect_files = ['Makefile', 'CMakeLists.txt', 'build.ninja']

[python]
symbol = " "
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style) '

[dart]
symbol = " "
detect_files = ['pubspec.yaml']

[swift]
symbol = " "

[docker_context]
symbol = " "
